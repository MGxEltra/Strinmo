    <title>Contact — Strinmo</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --mint: #e4f8d8;
        --peach: #fce7d0;
        --cream: #fffdf7;
        --ink: #2f3a2c;
        --muted: #71806c;
        --coral: #e85d50;
        --teal: #12a594;
        --reddit: #ff4500;
        --font-display: 'Fraunces', Georgia, serif;
        --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont,
          'Segoe UI', sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --mint: #1b2a1a;
          --peach: #2a1f1a;
          --cream: #232a22;
          --ink: #edf3e8;
          --muted: #9fb098;
          --coral: #ff8a7b;
          --teal: #2dd4c0;
          --reddit: #ff6a33;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, var(--mint) 0%, var(--peach) 100%);
        font-family: var(--font-body);
        color: var(--ink);
        padding: clamp(1.25rem, 6vw, 4rem) 1.25rem;
        position: relative;
        transition: background-color 0.2s ease;
      }

      body::before,
      body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.4;
        z-index: 0;
        pointer-events: none;
      }

      body::before {
        width: 260px;
        height: 260px;
        background: var(--coral);
        top: -70px;
        left: -70px;
      }

      body::after {
        width: 240px;
        height: 240px;
        background: var(--teal);
        bottom: -60px;
        right: -60px;
      }

      .page-wrap {
        width: 100%;
        max-width: 420px;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;

        transition: transform 0.15s ease, background-color 0.15s ease,

      }

      .link-btn svg {

      }

      .link-btn:active {

      .link-btn.email {

      .link-btn.email:hover,

        color: #fff;

        box-shadow: 0 10px 24px -10px rgba(255, 69, 0, 0.5);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);

      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
