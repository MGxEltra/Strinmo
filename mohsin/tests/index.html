<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests — Mohsin's Study Hub</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236E2A34'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='32' fill='%23F3EEE1'%3EM%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    :root {
      --bg: #F3EEE1;
      --surface: #FFFDF8;
      --ink: #2A2622;
      --ink-soft: #6B6255;
      --accent: #6E2A34;
      --accent-2: #9C7A2E;
      --rule: #DED2BC;
      --focus: #6E2A34;
      --danger-bg: #F6E1DD;
      --danger-ink: #8A3B2E;

      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'IBM Plex Sans', system-ui, sans-serif;
      --shadow: 3px 3px 0 var(--rule);
    }

    [data-theme="dark"] {
      --bg: #14161D;
      --surface: #1B1E27;
      --ink: #EDE6D6;
      --ink-soft: #A6A090;
      --accent: #C9A227;
      --accent-2: #A85D63;
      --rule: #2B2E3A;
      --focus: #C9A227;
      --danger-bg: #33222A;
      --danger-ink: #E29C93;
      --shadow: 3px 3px 0 var(--rule);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    .wrap { max-width: 760px; margin: 0 auto; padding: 0 1.5rem 4rem; }

    /* Sticky header: home link, page title, theme toggle */
    .page-head {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      margin: 0 -1.5rem;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      font-size: 0.95rem;
      color: var(--ink-soft);
      flex-shrink: 0;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 1.15rem; height: 1.15rem; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    .page-title-wrap { display: flex; align-items: center; gap: 0.55rem; margin-right: auto; }
    .page-title-wrap svg { width: 1.6rem; height: 1.6rem; flex-shrink: 0; }
    .page-title { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 0; }

    .theme-toggle {
      background: transparent; border: 1px solid var(--rule); border-radius: 999px;
      width: 2.3rem; height: 2.3rem; cursor: pointer; color: var(--ink);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .theme-toggle svg { width: 1.05rem; height: 1.05rem; }
    .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    /* Form card */
    .entry-form {
      margin-top: 2rem;
      background: var(--surface);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 0.4rem; flex: 1 1 200px; }
    .field label { font-size: 0.85rem; color: var(--ink-soft); }
    .field input {
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
    }
    .field input:focus-visible { outline-offset: 1px; }

    .save-btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.6rem 1.3rem;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: var(--surface);
      cursor: pointer;
      flex-shrink: 0;
    }
    .save-btn:hover { opacity: 0.9; }

    /* Entry list */
    .entry-list { list-style: none; margin: 2rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .entry-list li {
      background: var(--surface);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .entry-text { word-break: break-word; }

    .remove-btn {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border: 0;
      border-radius: 999px;
      background: var(--danger-bg);
      color: var(--danger-ink);
      cursor: pointer;
      flex-shrink: 0;
    }
    .remove-btn:hover { opacity: 0.85; }

    .empty-state { margin-top: 2rem; color: var(--ink-soft); font-size: 0.95rem; }

    @media (max-width: 480px) {
      .entry-form { flex-direction: column; align-items: stretch; }
      .save-btn { width: 100%; }
      .page-title { display: none; } /* keep header compact on very small screens */
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="page-head">
      <a class="back-link" href="/mohsin" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <span aria-hidden="true">Home</span>
      </a>
      <div class="page-title-wrap" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="var(--accent)"></circle><text x="32" y="43" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="30" fill="var(--surface)">M</text></svg>
        <h1 class="page-title">Tests</h1>
      </div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
    </header>

    <form class="entry-form" id="entryForm">
      <div class="field" style="flex: 2 1 260px;">
        <label for="EventName">Test name</label>
        <input placeholder="e.g. Chemistry — chapter 3" id="EventName">
      </div>
      <div class="field" style="flex: 1 1 160px;">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput">
      </div>
      <button type="button" class="save-btn" id="enterBtn">Save</button>
    </form>

    <ul class="entry-list" id="userList"></ul>
    <p class="empty-state" id="emptyState" hidden>No tests added yet — add your first one above.</p>
  </div>

  <script>
    (function () {
      var toggle = document.getElementById('themeToggle');
      function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'light'; }
      function applyState() {
        var isDark = currentTheme() === 'dark';
        toggle.setAttribute('aria-pressed', String(isDark));
        toggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      applyState();
      toggle.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        applyState();
      });
    })();

    const shortInput = document.getElementById("EventName");
    const dateInput = document.getElementById("dateInput");
    const button = document.getElementById("enterBtn");

    // Default the date field to today
    dateInput.value = new Date().toISOString().slice(0, 10);

    shortInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") button.click();
    });

    let user = JSON.parse(localStorage.getItem("Tests_Mohsin")) || {};

    const userList = document.getElementById("userList");
    const emptyState = document.getElementById("emptyState");

    function renderList() {
      userList.innerHTML = "";
      const keys = Object.keys(user);
      emptyState.hidden = keys.length !== 0;
      for (let key of keys) {
        const li = document.createElement("li");

        const span = document.createElement("span");
        span.className = "entry-text";
        span.textContent = user[key];
        li.appendChild(span);

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.textContent = "Remove";
        delBtn.className = "remove-btn";
        delBtn.addEventListener("click", () => {
          delete user[key];
          localStorage.setItem("Tests_Mohsin", JSON.stringify(user));
          renderList();
        });
        li.appendChild(delBtn);

        userList.appendChild(li);
      }
    }

    button.addEventListener("click", () => {
      const input_eventName = shortInput.value.trim();
      if (input_eventName.length === 0) {
        alert("Type Test Name");
        return;
      }
      if (!dateInput.value) {
        alert("Pick a date");
        return;
      }
      // Keep the same "D/M/YYYY" display format as before, without leading zeros
      const [y, m, d] = dateInput.value.split("-").map(Number);
      const Date_Event = `${input_eventName} - ${d}/${m}/${y}`;

      const newKey = `name: ${Math.random()}`;
      user[newKey] = Date_Event;
      localStorage.setItem("Tests_Mohsin", JSON.stringify(user));

      shortInput.value = "";
      dateInput.value = new Date().toISOString().slice(0, 10);
      renderList();
    });

    renderList();
  </script>
</body>
</html>
