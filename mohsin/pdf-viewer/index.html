<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PDF Library — Mohsin's Study Hub</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%236E2A34'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='32' fill='%23F3EEE1'%3EM%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    :root {
      --bg: #F3EEE1;
      --surface: #FFFDF8;
      --ink: #2A2622;
      --ink-soft: #6B6255;
      --accent: #6E2A34;
      --accent-2: #9C7A2E;
      --rule: #DED2BC;
      --focus: #6E2A34;
      --danger-bg: #F6E1DD;
      --danger-ink: #8A3B2E;

      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'IBM Plex Sans', system-ui, sans-serif;
      --shadow: 3px 3px 0 var(--rule);
    }

    [data-theme="dark"] {
      --bg: #14161D;
      --surface: #1B1E27;
      --ink: #EDE6D6;
      --ink-soft: #A6A090;
      --accent: #C9A227;
      --accent-2: #A85D63;
      --rule: #2B2E3A;
      --focus: #C9A227;
      --danger-bg: #33222A;
      --danger-ink: #E29C93;
      --shadow: 3px 3px 0 var(--rule);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

    .wrap { max-width: 760px; margin: 0 auto; padding: 0 1.5rem 4rem; }

    .page-head {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.5rem 1rem;
      margin: 0 -1.5rem;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
    }

    .back-link {
      display: flex; align-items: center; gap: 0.35rem;
      text-decoration: none; font-size: 0.95rem; color: var(--ink-soft); flex-shrink: 0;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 1.15rem; height: 1.15rem; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    .page-title-wrap { display: flex; align-items: center; gap: 0.55rem; margin-right: auto; }
    .page-title-wrap svg { width: 1.6rem; height: 1.6rem; flex-shrink: 0; }
    .page-title { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 0; }

    .icon-btn, .theme-toggle {
      background: transparent; border: 1px solid var(--rule); border-radius: 999px;
      width: 2.5rem; height: 2.5rem; cursor: pointer; color: var(--ink);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn svg, .theme-toggle svg { width: 1.05rem; height: 1.05rem; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn:hover, .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    .entry-form {
      margin-top: 0.85rem;
      background: var(--surface);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
    }
    .field { display: flex; flex-direction: column; gap: 0.4rem; flex: 1 1 200px; min-width: 0; }
    .field.full { flex-basis: 100%; }
    .field label { font-size: 0.85rem; color: var(--ink-soft); }
    .field input {
      font-family: var(--font-body);
      font-size: 1rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
    }
    .field input[type="file"] {
      padding: 0.45rem 0.7rem 0.45rem 0.45rem;
      cursor: pointer;
      border: 1px dashed var(--rule);
      background: var(--bg);
    }
    .field input[type="file"]:hover { border-color: var(--accent-2); }
    .field input[type="file"]::file-selector-button,
    .field input[type="file"]::-webkit-file-upload-button {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.5rem 1.05rem;
      margin-right: 0.85rem;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--surface);
      cursor: pointer;
      transition: opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .field input[type="file"]:hover::file-selector-button,
    .field input[type="file"]:hover::-webkit-file-upload-button {
      opacity: 0.9;
    }

    .save-btn {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.6rem 1.3rem;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: var(--surface);
      cursor: pointer;
      flex-shrink: 0;
    }
    .save-btn:hover { opacity: 0.9; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .storage-note {
      margin: 0.75rem 0 0;
      font-size: 0.82rem;
      color: var(--ink-soft);
    }
    .storage-bar {
      margin-top: 0.45rem;
      height: 6px;
      border-radius: 999px;
      background: var(--rule);
      overflow: hidden;
    }
    .storage-bar-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }
    .storage-bar-fill.warn { background: var(--danger-ink); }

    .entry-list { list-style: none; margin: 2rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
    .entry-list li {
      background: var(--surface);
      border: 1px solid var(--rule);
      box-shadow: var(--shadow);
      padding: 0.9rem 1.1rem;
    }
    .entry-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .entry-info { display: flex; align-items: flex-start; gap: 0.75rem; min-width: 0; }
    .entry-info svg { width: 1.6rem; height: 1.6rem; stroke: var(--accent); fill: none; stroke-width: 1.5; flex-shrink: 0; margin-top: 0.15rem; }
    .entry-text { min-width: 0; }
    .entry-name { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; margin: 0; word-break: break-word; }
    .entry-meta { margin: 0.15rem 0 0; font-size: 0.82rem; color: var(--ink-soft); }

    .entry-actions { display: flex; gap: 0.5rem; flex-shrink: 0; flex-wrap: wrap; }
    .pill-btn {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .pill-btn:hover { border-color: var(--accent); color: var(--accent); }
    .remove-btn {
      border: 0; background: var(--danger-bg); color: var(--danger-ink);
    }
    .remove-btn:hover { opacity: 0.85; color: var(--danger-ink); }

    .viewer {
      margin-top: 0.9rem;
      border: 1px solid var(--rule);
      border-radius: 6px;
      overflow: hidden;
      height: 70vh;
    }
    .viewer iframe { width: 100%; height: 100%; border: 0; background: var(--surface); }

    .empty-state { margin-top: 2rem; color: var(--ink-soft); font-size: 0.95rem; }

    @media (max-width: 480px) {
      .entry-form { flex-direction: column; align-items: stretch; }
      .save-btn { width: 100%; }
      .page-title { display: none; }
      .viewer { height: 60vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="page-head">
      <a class="back-link" href="/mohsin" aria-label="Back to home">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        <span aria-hidden="true">Home</span>
      </a>
      <div class="page-title-wrap" aria-hidden="true">
        <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="var(--accent)"></circle><text x="32" y="43" text-anchor="middle" font-family="var(--font-display)" font-weight="600" font-size="30" fill="var(--surface)">M</text></svg>
        <h1 class="page-title">PDF Library</h1>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" class="sr-only" tabindex="-1">
      <button type="button" class="icon-btn" id="exportBtn" aria-label="Export library as JSON file">
        <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
      </button>
      <button type="button" class="icon-btn" id="importBtn" aria-label="Import library from JSON file">
        <svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 19h16"/></svg>
      </button>
      <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
      </button>
    </header>

    <form class="entry-form" id="entryForm">
      <div class="field full">
        <label for="fileInput">Add PDF file(s)</label>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple>
      </div>
      <button type="button" class="save-btn" id="addBtn">Add to library</button>
    </form>

    <p class="storage-note" id="storageNote"></p>
    <div class="storage-bar"><div class="storage-bar-fill" id="storageBarFill"></div></div>

    <ul class="entry-list" id="pdfList"></ul>
    <p class="empty-state" id="emptyState" hidden>No PDFs yet — add one above.</p>
  </div>

  <script>
    (function () {
      var toggle = document.getElementById('themeToggle');
      function currentTheme() { return document.documentElement.getAttribute('data-theme') || 'light'; }
      function applyState() {
        var isDark = currentTheme() === 'dark';
        toggle.setAttribute('aria-pressed', String(isDark));
        toggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
      }
      applyState();
      toggle.addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        applyState();
      });
    })();

    // --- Config ---
    const DB_NAME = "PDFLibraryDB_Mohsin";
    const STORE_NAME = "pdfs";
    const SAFETY_MARGIN = 0.92; // leave ~8% headroom below the browser-reported quota
    const BASE64_OVERHEAD = 1.37; // a data URL is ~37% larger than the original binary
    const FALLBACK_BYTES = 50 * 1024 * 1024; // used only if the browser won't report a quota

    // Reads the real, current storage quota/usage from the browser itself.
    // Returns { usage, quota, supported }. quota/usage are in bytes.
    async function getStorageInfo() {
      if (navigator.storage && navigator.storage.estimate) {
        try {
          const est = await navigator.storage.estimate();
          if (est && typeof est.quota === "number" && est.quota > 0) {
            return { usage: est.usage || 0, quota: est.quota, supported: true };
          }
        } catch (e) { /* fall through to fallback */ }
      }
      // Browser doesn't expose a quota — fall back to a conservative guess.
      return { usage: 0, quota: FALLBACK_BYTES, supported: false };
    }

    const fileInput = document.getElementById("fileInput");
    const addBtn = document.getElementById("addBtn");
    const pdfList = document.getElementById("pdfList");
    const emptyState = document.getElementById("emptyState");
    const storageNote = document.getElementById("storageNote");
    const storageBarFill = document.getElementById("storageBarFill");
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");

    // --- IndexedDB helpers ---
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAll() {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPutMany(records) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        records.forEach(r => tx.objectStore(STORE_NAME).put(r));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDelete(id) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbClearAndReplace(records) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        const store = tx.objectStore(STORE_NAME);
        store.clear();
        records.forEach(r => store.put(r));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // --- Helpers ---
    function formatBytes(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(1) + " MB";
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function currentTotalBytes() {
      const all = await dbGetAll();
      return all.reduce((sum, r) => sum + (r.size || 0), 0);
    }

    // The usable ceiling: the browser's own quota (minus a safety margin),
    // read fresh each time rather than assumed.
    async function getUsableLimit() {
      const info = await getStorageInfo();
      return { limit: info.quota * SAFETY_MARGIN, usage: info.usage, supported: info.supported };
    }

    async function refreshStorageNote() {
      const all = await dbGetAll();
      const total = all.reduce((sum, r) => sum + (r.size || 0), 0);
      const { limit, usage, supported } = await getUsableLimit();
      // Prefer the browser's real usage figure (covers DB overhead); fall back to our own tally.
      const used = usage > 0 ? usage : total;
      const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : 0;
      storageBarFill.style.width = pct + "%";
      storageBarFill.classList.toggle("warn", pct > 85);
      storageNote.textContent = all.length
        ? `${all.length} file(s) — ${formatBytes(total)} stored, ~${formatBytes(limit)} available in this browser` + (supported ? "." : " (estimated — your browser doesn't report a quota).")
        : `PDFs are stored in this browser — currently ~${formatBytes(limit)} available` + (supported ? "." : " (estimated).") + ` Export to a .json file to back them up or move them to another device.`;
    }

    // --- Add files ---
    addBtn.addEventListener("click", async () => {
      const files = Array.from(fileInput.files || []);
      if (files.length === 0) { alert("Choose at least one PDF file."); return; }

      const incomingBytes = files.reduce((sum, f) => sum + f.size, 0);
      const { limit, usage, supported } = await getUsableLimit();
      const currentUsage = usage > 0 ? usage : await currentTotalBytes();
      const projectedUsage = currentUsage + incomingBytes * BASE64_OVERHEAD;
      if (limit > 0 && projectedUsage > limit) {
        const remaining = Math.max(0, limit - currentUsage);
        alert(`That would exceed the space available in this browser (~${formatBytes(remaining)} left of ~${formatBytes(limit)}${supported ? "" : ", estimated"}). Remove something first, add fewer files, or export/clear old PDFs.`);
        return;
      }

      addBtn.disabled = true;
      addBtn.textContent = "Adding…";

      const newRecords = [];
      for (const file of files) {
        try {
          const dataUrl = await fileToDataUrl(file);
          newRecords.push({
            id: `pdf_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
            name: file.name.replace(/\.pdf$/i, ""),
            size: file.size,
            added: new Date().toISOString(),
            dataUrl: dataUrl
          });
        } catch (e) {
          alert(`Couldn't read "${file.name}".`);
        }
      }

      try {
        await dbPutMany(newRecords);
      } catch (e) {
        alert("Couldn't save — the browser's storage may be full.");
      }

      fileInput.value = "";
      addBtn.disabled = false;
      addBtn.textContent = "Add to library";
      render();
    });

    // --- Render list ---
    async function render() {
      const records = await dbGetAll();
      pdfList.innerHTML = "";
      emptyState.hidden = records.length !== 0;
      records.sort((a, b) => (b.added || "").localeCompare(a.added || ""));

      for (const entry of records) {
        const li = document.createElement("li");

        const top = document.createElement("div");
        top.className = "entry-top";

        const info = document.createElement("div");
        info.className = "entry-info";
        info.innerHTML = `<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/></svg>`;

        const text = document.createElement("div");
        text.className = "entry-text";
        const name = document.createElement("p");
        name.className = "entry-name";
        name.textContent = entry.name || "Untitled";
        const meta = document.createElement("p");
        meta.className = "entry-meta";
        meta.textContent = `${formatBytes(entry.size || 0)} · added ${formatDate(entry.added)}`;
        text.appendChild(name);
        text.appendChild(meta);
        info.appendChild(text);

        const actions = document.createElement("div");
        actions.className = "entry-actions";

        const viewBtn = document.createElement("button");
        viewBtn.type = "button";
        viewBtn.className = "pill-btn";
        viewBtn.textContent = "View";

        const downloadLink = document.createElement("a");
        downloadLink.className = "pill-btn";
        downloadLink.textContent = "Download";
        downloadLink.href = entry.dataUrl;
        downloadLink.download = (entry.name || "document") + ".pdf";

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "pill-btn remove-btn";
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", async () => {
          if (!confirm(`Remove "${entry.name}" from the library?`)) return;
          try { await dbDelete(entry.id); } catch (e) { alert("Couldn't remove the file."); }
          render();
        });

        actions.appendChild(viewBtn);
        actions.appendChild(downloadLink);
        actions.appendChild(removeBtn);

        top.appendChild(info);
        top.appendChild(actions);
        li.appendChild(top);

        const viewerWrap = document.createElement("div");
        viewerWrap.className = "viewer";
        viewerWrap.hidden = true;
        li.appendChild(viewerWrap);

        viewBtn.addEventListener("click", () => {
          if (!viewerWrap.hidden) {
            viewerWrap.hidden = true;
            viewerWrap.innerHTML = "";
            viewBtn.textContent = "View";
            return;
          }
          viewerWrap.innerHTML = `<iframe src="${entry.dataUrl}" title="${(entry.name || 'PDF').replace(/"/g, '')}"></iframe>`;
          viewerWrap.hidden = false;
          viewBtn.textContent = "Hide";
        });

        pdfList.appendChild(li);
      }

      refreshStorageNote();
    }

    // --- JSON export / import (capped at 100 MB) ---
    exportBtn.addEventListener("click", async () => {
      const records = await dbGetAll();
      const data = JSON.stringify(records);

      const today = new Date().toISOString().slice(0, 10);
      const suggestedName = `pdf-library-${today}.json`;

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName,
            types: [{ description: "JSON file", accept: { "application/json": [".json"] } }]
          });
          const writable = await handle.createWritable();
          await writable.write(data);
          await writable.close();
        } catch (err) {
          if (err.name !== "AbortError") alert("Couldn't save the file: " + err.message);
        }
        return;
      }

      let filename = prompt("Save as:", suggestedName);
      if (filename === null) return;
      filename = filename.trim() || suggestedName;
      if (!filename.toLowerCase().endsWith(".json")) filename += ".json";

      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    importBtn.addEventListener("click", () => importFile.click());

    importFile.addEventListener("change", () => {
      const file = importFile.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async () => {
        let parsed;
        try {
          parsed = JSON.parse(reader.result);
        } catch (e) {
          alert("That file isn't valid JSON.");
          importFile.value = "";
          return;
        }
        if (!Array.isArray(parsed)) {
          alert("That file doesn't look like a PDF library export.");
          importFile.value = "";
          return;
        }

        // Importing replaces the library, so check the incoming size against
        // the browser's own quota rather than what's currently stored.
        const incomingBytes = parsed.reduce((sum, r) => sum + (r.size || 0), 0);
        const { limit, supported } = await getUsableLimit();
        if (limit > 0 && incomingBytes * BASE64_OVERHEAD > limit) {
          alert(`This import needs roughly ${formatBytes(incomingBytes * BASE64_OVERHEAD)}, more than the ~${formatBytes(limit)} available in this browser${supported ? "" : " (estimated)"}.`);
          importFile.value = "";
          return;
        }

        if (!confirm("This will replace your current PDF library with the imported file. Continue?")) {
          importFile.value = "";
          return;
        }
        try {
          await dbClearAndReplace(parsed);
        } catch (e) {
          alert("Couldn't import — the browser's storage may be full.");
        }
        render();
        importFile.value = "";
      };
      reader.readAsText(file);
    });

    render();
  </script>
</body>
</html>
